name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # AI rasm dvigateli (stable-diffusion.cpp), aniq bir versiyaga mahkamlangan.
      - name: Fetch stable-diffusion.cpp
        run: |
          mkdir -p app/src/main/cpp/sdcpp
          cd app/src/main/cpp/sdcpp
          git init -q
          git remote add origin https://github.com/leejet/stable-diffusion.cpp
          git fetch -q --depth 1 origin 32d516c0197ed5ca31305b8575e14eb1451fad33
          git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 ggml

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VideoStudio.apk

      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Video Studio build ${{ github.run_number }}
          body: Telefonga o'rnatish uchun VideoStudio.apk faylini yuklab oling.
          files: VideoStudio.apk

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: failed-${{ github.run_number }}
          name: Build ${{ github.run_number }} failed
          prerelease: true
          files: build.log
